name: nifunze
description: "A kids learning application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.2
  supabase_flutter: ^2.17.2
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatar/
    - assets/images/rank/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "logo.png"

flutter_native_splash:
  background_image: "assets/images/splash_bg.jpeg"
  image: "logo.png"
  android: true
  ios: true
